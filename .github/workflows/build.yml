name: Build apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      release:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.release || false }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.cpu }}
    runs-on: ${{ matrix.runner }}
    # Release builds read their code signing secrets from the release environment.
    environment: ${{ inputs.release && 'release' || '' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            cpu: arm64
            qt-arch: clang_64
            update-feed-var: FORWARD_UPDATE_FEED_MACOS_ARM64
            update-key-var: FORWARD_UPDATE_PUBLIC_KEY_MACOS
          - runner: macos-15-intel
            platform: macos
            cpu: x86_64
            qt-arch: clang_64
            update-feed-var: FORWARD_UPDATE_FEED_MACOS_X86_64
            update-key-var: FORWARD_UPDATE_PUBLIC_KEY_MACOS
          - runner: windows-2022
            platform: windows
            cpu: x64
            qt-arch: win64_msvc2022_64
            update-feed-var: FORWARD_UPDATE_FEED_WINDOWS_X64
            update-key-var: FORWARD_UPDATE_PUBLIC_KEY_WINDOWS

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.2'
          arch: ${{ matrix.qt-arch }}
          modules: qthttpserver qtwebsockets qtimageformats
          cache: true

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Check out Qt MQTT
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: qt/qtmqtt
          ref: 3bbef1d7643b71465a114a7163990ac59da68ff4 # Qt 6.9.2
          path: build-deps/qtmqtt
          persist-credentials: false

      - name: Configure Qt MQTT
        shell: bash
        run: >-
          cmake -G Ninja -S build-deps/qtmqtt -B build-deps/qtmqtt-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"
          -DCMAKE_INSTALL_PREFIX="${QT_ROOT_DIR}"
          -DQT_BUILD_TESTS=OFF
          -DQT_BUILD_EXAMPLES=OFF

      - name: Build Qt MQTT
        run: cmake --build build-deps/qtmqtt-build --parallel

      - name: Install Qt MQTT
        run: cmake --install build-deps/qtmqtt-build

      - name: Import Developer ID certificate
        # Releases are signed once the identity is configured (packaging/updates/README.md).
        if: runner.os == 'macOS' && inputs.release && vars.FORWARD_MACOS_SIGNING_IDENTITY != ''
        env:
          FORWARD_MACOS_CERTIFICATE_P12: ${{ secrets.FORWARD_MACOS_CERTIFICATE_P12 }}
          FORWARD_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.FORWARD_MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/forward-signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          base64 --decode <<< "$FORWARD_MACOS_CERTIFICATE_P12" > "$RUNNER_TEMP/forward-signing.p12"
          security import "$RUNNER_TEMP/forward-signing.p12" -k "$keychain" -f pkcs12 \
            -P "$FORWARD_MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/forward-signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Configure
        env:
          FORWARD_UPDATE_FEED_URL: ${{ vars[matrix.update-feed-var] }}
          FORWARD_UPDATE_PUBLIC_KEY: ${{ vars[matrix.update-key-var] }}
          FORWARD_CODESIGN_IDENTITY: ${{ runner.os == 'macOS' && inputs.release && vars.FORWARD_MACOS_SIGNING_IDENTITY || '' }}
        shell: bash
        run: |
          # Without a public key, normal CI produces an updater-disabled build.
          if [[ -z "$FORWARD_UPDATE_PUBLIC_KEY" ]]; then
            FORWARD_UPDATE_FEED_URL=""
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DFORWARD_UPDATE_FEED_URL="${FORWARD_UPDATE_FEED_URL}" \
            -DFORWARD_UPDATE_PUBLIC_KEY="${FORWARD_UPDATE_PUBLIC_KEY}" \
            -DFORWARD_CODESIGN_IDENTITY="${FORWARD_CODESIGN_IDENTITY}"

      - name: Build and deploy dependencies
        run: cmake --build build --config Release --parallel

      - name: Package macOS
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target package

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Releases are signed once Artifact Signing is configured (packaging/updates/README.md).
          SIGN: ${{ inputs.release && vars.FORWARD_SIGNING_ACCOUNT != '' }}
          FORWARD_SIGNING_ENDPOINT: ${{ vars.FORWARD_SIGNING_ENDPOINT }}
          FORWARD_SIGNING_ACCOUNT: ${{ vars.FORWARD_SIGNING_ACCOUNT }}
          FORWARD_SIGNING_PROFILE: ${{ vars.FORWARD_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ vars.FORWARD_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.FORWARD_SIGNING_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.FORWARD_SIGNING_CLIENT_SECRET }}
        run: |
          New-Item -ItemType Directory -Path dist -Force
          $iscc = @()
          if ($env:SIGN -eq 'true') {
            # Every binary Forward loads, so Smart App Control allows them, before the
            # Microsoft-signed runtime DLLs join them.
            pwsh -NoProfile -File packaging/windows/sign.ps1 (Get-ChildItem build/Release -Recurse -Include *.exe, *.dll).FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $iscc = '/DSign', "/Sforward=pwsh -NoProfile -File `$q$PWD/packaging/windows/sign.ps1`$q `$f"
          }
          Copy-Item README.md build/Release/README.md
          Copy-Item LICENSE build/Release/LICENSE
          Copy-Item build/_deps/miniz-src/LICENSE build/Release/miniz-LICENSE
          Copy-Item build-deps/qtmqtt/LICENSES/GPL-3.0-only.txt build/Release/QtMqtt-LICENSE
          Copy-Item "$env:VCToolsRedistDir/x64/Microsoft.VC143.CRT/*.dll" build/Release/
          Compress-Archive -Path build/Release/* -DestinationPath dist/mirdain_forward-windows-x64.zip
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" @iscc build/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record release build metadata
        if: inputs.release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          FORWARD_RELEASE_PLATFORM: ${{ matrix.platform }}-${{ matrix.cpu }}
          FORWARD_UPDATE_PUBLIC_KEY_MACOS: ${{ vars.FORWARD_UPDATE_PUBLIC_KEY_MACOS }}
          FORWARD_UPDATE_PUBLIC_KEY_WINDOWS: ${{ vars.FORWARD_UPDATE_PUBLIC_KEY_WINDOWS }}
        run: python tools/release_updates.py build-metadata --tag "$RELEASE_TAG" --platform "$FORWARD_RELEASE_PLATFORM" --output "dist/$FORWARD_RELEASE_PLATFORM.json"

      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mirdain_forward-${{ matrix.platform }}-${{ matrix.cpu }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-setup.exe
            dist/*.json
          if-no-files-found: error
          retention-days: 14
